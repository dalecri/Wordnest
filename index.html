window.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')endGesture(e.pointerId,e.timeStamp);});
window.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch')endGesture(e.pointerId,e.timeStamp,true);});
card.addEventListener('lostpointercapture',e=>{if(drag?.kind==='pointer')endGesture(e.pointerId,e.timeStamp,true);});
function cancelGesture(){if(drag)endGesture(drag.id,performance.now(),true);}
window.addEventListener('blur',cancelGesture);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelGesture();});
start(true);
})();
</script></body></html>
